{% extends 'base.html' %}

{% block content %}
<div class="card card-welcome">
    <h1>Welcome, {{ user.first_name }}!</h1>
    
    <p class="text-muted-large">
        You are successfully logged into the Educational Center portal.
    </p>

    <div class="role-badge">
        <span class="role-label">Current Role</span>
        <br>
        <strong class="role-value">{{ user.role }}</strong>
    </div>
</div>
{% endblock content %}
