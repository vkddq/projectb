{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCenter Portal</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/academics/">Academics</a>
        <a href="/schedule/">Schedule</a>
        
        <div class="nav-right" id="nav-auth-buttons">
            </div>
    </nav>
    
   <script>
    document.addEventListener("DOMContentLoaded", function() {
        const navBlock = document.getElementById('nav-auth-buttons');
        const token = localStorage.getItem('access_token');

        if (token) {
            navBlock.innerHTML = `
                <a href="/dashboard/" class="btn-nav-primary">Dashboard</a>
                <a href="#" onclick="handleLogout()" class="text-danger">Logout</a>
            `;
        } else {
            navBlock.innerHTML = `
                <a href="/login/" class="btn-nav-primary">Log In</a>
            `;
        }
    });

    function handleLogout() {
        localStorage.removeItem('access_token');
        localStorage.removeItem('refresh_token');
        window.location.href = '/';
    }
</script>
    
    <div class="container">
        {% block content %}
        {% endblock content %}
    </div>
</body>
</html>
